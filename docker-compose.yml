name: coedit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: coedit
    ports:
      - '55433:5432'
    volumes:
      - coedit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d coedit']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - coedit-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://postgres@postgres:5432/coedit
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef0123456789}
      APP_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AUTO_MIGRATE: 'true'
      LOG_LEVEL: info
    ports:
      - '8787:8787'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: production
      API_URL: http://server:8787
      WS_URL: ws://localhost:8787/ws
      APP_ORIGINS: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - server
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: Dockerfile.server
    profiles: ['seed']
    command: ['node', 'dist/scripts/seed.js']
    environment:
      DATABASE_URL: postgres://postgres@postgres:5432/coedit
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef0123456789}
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started

volumes:
  coedit-postgres:
  coedit-redis:
